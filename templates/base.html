<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Agent Trace Workbench{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
    <script defer src="{{ url_for('static', path='app.js') }}"></script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/">
            <span class="brand-mark">ATW</span>
            <span>Agent Trace<br>Workbench</span>
        </a>
        <nav aria-label="Primary navigation">
            <a href="/">Runs</a>
            <a href="/compare">Compare</a>
            <a class="nav-api" href="/docs">API docs</a>
        </nav>
    </header>
    <main class="shell">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer shell">
        <span>Local by design.</span>
        <span>Trace data stays in your SQLite file.</span>
        {% if store %}<span class="store-status">{{ store.journal_mode }} journal · busy {{ store.busy_timeout_ms }} ms · SQLite {{ store.sqlite_version }}</span>{% endif %}
    </footer>
</body>
</html>
